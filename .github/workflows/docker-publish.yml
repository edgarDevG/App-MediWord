name: Publish Docker Images

on:
  push:
    branches:
      - master

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Backend (latest)
        uses: docker/build-push-action@v5
        with:
          context: ./backend-v2
          push: true
          tags: edgardevv/app-mediword-backend:latest

      - name: Build and push Frontend (Production)
        uses: docker/build-push-action@v5
        with:
          context: ./frontend/react-v2
          push: true
          tags: edgardevv/app-mediword-frontend:latest

      - name: Build and push Frontend (Local Dev Builder)
        uses: docker/build-push-action@v5
        with:
          context: ./frontend/react-v2
          target: builder
          push: true
          tags: edgardevv/app-mediword-frontend:local-dev
