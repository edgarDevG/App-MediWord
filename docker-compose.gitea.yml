services:

  # ── Backend FastAPI ──────────────────────────────────────────
  backend:
    build:
      context: ./backend-v2 # Apunta a la carpeta de tu código backend en Gitea
      # Buil: app-medindex-backend:local # Nombre local para la imagen construida
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      PORT: 8001
      MEDIA_ROOT: /app/uploads/medicos
    ports:
      - "6005:8001"
    volumes:
      - mediword_uploads:/app/uploads/medicos
    networks:
      - mediword_net

  # ── Frontend React + Nginx ───────────────────────────────────
  frontend:
    build:
      context: ./frontend/react-v2 # Apunta a la carpeta de tu código frontend en Gitea
    # image: app-medindex-frontend:local # Nombre local para la imagen construida
    restart: unless-stopped
    ports:
      - "7002:80"

    depends_on:
      - backend
    networks:
      - mediword_net

networks:
  mediword_net:
    driver: bridge

volumes:
  mediword_uploads:
    driver: local
    driver_opts:
      type: cifs
      device: "//10.28.110.106/Compartido/app_medicos"
      o: "username=${SAMBA_USER},password=${SAMBA_PASS},vers=3.0,uid=1000,gid=1000,file_mode=0770,dir_mode=0770"
