services:

  # ── Backend FastAPI ──────────────────────────────────────────
  backend:
    image: edgardevv/app-mediword-backend:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      PORT: 8001
      MEDIA_ROOT: /app/uploads/medicos
    ports:
      - "6005:8001"
    volumes:
      - mediword_uploads:/app/uploads/medicos
    networks:
      - mediword_net

  # ── Frontend React + Nginx ───────────────────────────────────
  frontend:
    image: edgardevv/app-mediword-frontend:latest
    restart: unless-stopped
    ports:
      - "7001:80"
    depends_on:
      - backend
    networks:
      - mediword_net

networks:
  mediword_net:
    driver: bridge

volumes:
  mediword_uploads:
    driver: local
    driver_opts:
      type: cifs
      device: "//10.28.110.106/app_medicos"
      o: "username=${SAMBA_USER},password=${SAMBA_PASS},vers=3.0,uid=1000,gid=1000,file_mode=0770,dir_mode=0770"
