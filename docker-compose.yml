services:

  # ── Backend FastAPI ──────────────────────────────────────────
  # BD externa: postgresql://dev_edgar@10.28.110.104:5432/MEDW
  # Las credenciales se leen de backend-v2/.env (gitignoreado)
  backend:
    build:
      context: ./backend-v2
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./backend-v2/.env
    ports:
      - "${BACKEND_PORT:-8001}:8001"
    networks:
      - mediword_net

  # ── Frontend React + Nginx ───────────────────────────────────
  frontend:
    build:
      context: ./frontend/react-v2
      dockerfile: Dockerfile
      args:
        # Ruta relativa: nginx proxy /api/v1/* → backend:8001
        VITE_API_URL: /api/v1
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    networks:
      - mediword_net

networks:
  mediword_net:
    driver: bridge
