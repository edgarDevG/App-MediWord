server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Permitir subir archivos de hasta 50MB
    client_max_body_size 50M;

    # Compresión gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml;
    gzip_min_length 1000;

    # Proxy hacia el backend
    location /api/v1/ {
        proxy_pass         http://backend:8001/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;

        # Nginx mismo genera el 307 al agregar trailing slash.
        # absolute_redirect off hace que el Location sea relativo (/api/v1/...)
        # en vez de absoluto (http://10.28.110.105/api/v1/...) — el browser
        # añade host+puerto automáticamente y no pierde el :7001.
        absolute_redirect off;
    }

    # Assets con caché larga
    location ~* \.(js|css|png|svg|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback con no-cache para index.html
    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri $uri/ /index.html;
    }
}
